# Alt+Up / Alt+Down page through scrollback without the prefix.
bind -n M-Up copy-mode -u
# (no root M-Down: tmux 3.4 lacks `copy-mode -d`; Alt+Down still pages down once in copy mode)
bind -T copy-mode M-Up send -X page-up
bind -T copy-mode M-Down send -X page-down
bind -T copy-mode-vi M-Up send -X page-up
bind -T copy-mode-vi M-Down send -X page-down
