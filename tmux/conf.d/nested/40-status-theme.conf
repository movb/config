# Theme (dark grey / amber). Agent dots come from @agent-state, which the supervisor
# poller on the main host sets on every agent pane here over ssh (red waiting, green working, grey idle).
set -g status-position bottom  # bottom: nested under the main tmux, its bar is the lower one
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour248"
set -g status-left-length 60
set -g status-right-length 150
set -g status-left "#[fg=colour214]#[bold] #S #[nobold]#[fg=colour245]W#{session_windows}·P#{window_panes} "
set -g status-right "#{?client_prefix,#[fg=colour231]#[bg=colour203]#[bold] PREFIX #[default] ,}#[fg=colour248]#{host_short} • %Y-%m-%d %H:%M "

setw -g window-status-current-style "fg=colour214,bold"
setw -g window-status-current-format " #I:#W#{?#{m:*waiting*,#{P:#{@agent-state} }},#[fg=colour203]●,#{?#{m:*working*,#{P:#{@agent-state} }},#[fg=colour108]●,#{?#{P:#{@agent}},#[fg=colour245]○,}}} "
setw -g window-status-format " #I:#W#{?#{m:*waiting*,#{P:#{@agent-state} }},#[fg=colour203]●,#{?#{m:*working*,#{P:#{@agent-state} }},#[fg=colour108]●,#{?#{P:#{@agent}},#[fg=colour245]○,}}} "

set -g pane-border-style "fg=colour33"
set -g pane-active-border-style "fg=colour214"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=colour214]#[bold]▶ #[default],}#P #{b:pane_current_path}#{?#{@agent}, — #[fg=colour108]#{?#{@tmux-pane-topic},#{=30:#{@tmux-pane-topic}},#{=30:#{@agent}}}#[default] · #{?#{==:#{@agent-state},waiting},#[fg=colour203]#[bold]waiting,#{?#{==:#{@agent-state},working},#[fg=colour108]working,#[fg=colour245]#{@agent-state}}}#[default],} "
