# tmux layer, main host (installed to ~/.config/tmux/conf.d/). Rollback: remove the source-file line
# from ~/.tmux.conf.

# Mouse off: iTerm's native selection and Cmd+C always work (OSC52 copies do not reach the Mac over ET).
# Scroll back with M-Up / prefix [; switch panes with prefix + arrows. Set "on" for click/drag/wheel/menus.
set -g mouse off

# Copies in copy mode reach the laptop clipboard via OSC52, also over ssh.
set -s set-clipboard on
# tmux sends OSC52 with an empty selection field ("52;;"); name the clipboard ("52;c;") explicitly.
set -as terminal-overrides ',xterm*:Ms=\E]52;c%p1%.0s;%p2%s\7'
