# ── Right-click context menu (pane operations) ───────────────────────────────
# The agent section mirrors prefix S / g / T (20-agent-keys.conf). "Detach (park)"
# moves a pane/window to the hidden __parked session (~/.local/bin/tmux-park); get it back with
# "Join from Window..." (__parked:N) or prefix s.
bind -n MouseDown3Pane display-menu -T "#[align=centre]Pane" -t = -x M -y M \
  "Agent dashboard"   S { display-popup -E -w 90% -h 80% "~/.local/bin/agent-dashboard --client '#{client_name}'" } \
  "Jump to agent"     g { run-shell -b "~/.local/bin/agent-jump --client '#{client_name}'" } \
  "Set pane topic..." T { command-prompt -p "topic:" -I "#{@tmux-pane-topic}" { set -p @tmux-pane-topic "%1" } } \
  "" \
  "Swap Up"           u { swap-pane -U } \
  "Swap Down"         d { swap-pane -D } \
  "Swap Left"         h { swap-pane -t '{left-of}' } \
  "Swap Right"        l { swap-pane -t '{right-of}' } \
  "" \
  "Rotate Forward"    r { rotate-window } \
  "Rotate Backward"   R { rotate-window -D } \
  "" \
  "Move to New Window" b { break-pane } \
  "Move to Window..." m { command-prompt -p "Move to window:" "move-pane -t '%%'" } \
  "Join from Window..." j { command-prompt -p "Join pane from window:" "join-pane -s '%%'" } \
  "" \
  "Layout: Tiled"     1 { select-layout tiled } \
  "Layout: Even Horiz" 2 { select-layout even-horizontal } \
  "Layout: Even Vert"  3 { select-layout even-vertical } \
  "Layout: Main Horiz" 4 { select-layout main-horizontal } \
  "Layout: Main Vert"  5 { select-layout main-vertical } \
  "" \
  "Mark Pane"         M { select-pane -m } \
  "Swap with Marked"  s { swap-pane } \
  "" \
  "#{?pane_marked,Unmark,Mark} This Pane" t { select-pane -m } \
  "Split Horiz"       - { split-window -v -c "#{pane_current_path}" } \
  "Split Vert"        | { split-window -h -c "#{pane_current_path}" } \
  "" \
  "#{?#{||:#{>:#{window_panes},1},#{>:#{session_windows},1}},Detach Pane (park),-}" D { run-shell -b "$HOME/.local/bin/tmux-park pane #{pane_id}" } \
  "Kill Pane"         x { confirm-before -p "Kill pane? (y/n)" kill-pane }

# ── Right-click context menu (window/status operations) ──────────────
bind -n MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W \
  "#{?#{>:#{session_windows},1},Swap Left,-}" l { swap-window -t :-1 } \
  "#{?#{>:#{session_windows},1},Swap Right,-}" r { swap-window -t :+1 } \
  "#{?pane_marked_set,Swap Marked,-}" s { swap-window } \
  "" \
  "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
  "Rename"            n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
  "" \
  "New After"         w { new-window -a } \
  "New At End"        W { new-window } \
  "" \
  "#{?#{>:#{session_windows},1},Detach Window (park),-}" D { run-shell -b "$HOME/.local/bin/tmux-park window #{window_id}" } \
  "Kill Window"       X { confirm-before -p "Kill window? (y/n)" kill-window }
