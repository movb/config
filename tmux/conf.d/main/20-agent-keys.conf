# prefix S: live agent dashboard (both hosts). Row key jumps, q closes.
bind S display-popup -E -w 90% -h 80% "~/.local/bin/agent-dashboard --client '#{client_name}'"

# prefix g: jump-to-agent menu.
bind g run-shell -b "~/.local/bin/agent-jump --client '#{client_name}'"

# prefix T: set this pane's topic; it becomes the agent's name in the agent tools.
bind T command-prompt -p 'topic:' -I '#{@tmux-pane-topic}' { set -p @tmux-pane-topic '%1' }
